spring.application.name=order-service

# Connect to all three brokers from Windows
spring.kafka.bootstrap-servers=localhost:19092,localhost:19093,localhost:19094

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all



# Start three consumer threads in this application
#spring.kafka.listener.concurrency=3





# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents

# ===============================
# REST CLIENT TIMEOUT
# ===============================

payment.client.connect-timeout=2s
payment.client.read-timeout=2s

# ===============================
# RESILIENCE4J RETRY
# ===============================

resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=1s

resilience4j.retry.instances.paymentService.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.paymentService.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException

# ===============================
# RESILIENCE4J CIRCUIT BREAKER
# ===============================

resilience4j.circuitbreaker.instances.paymentService.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5

resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.paymentService.record-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.paymentService.record-exceptions[1]=org.springframework.web.client.ResourceAccessException